<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>しまなみかぶぬしミーティング｜歴代ロゴ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .scene {
      width: min(94vw, 900px);
      height: 88vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .logo-area {
      width: 100%;
      height: calc(100% - 55px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo {
      display: block;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .info {
      height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      font-size: 13px;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    @media (max-width: 480px) {
      .scene {
        width: 94vw;
        height: 84vh;
      }

      .logo-area {
        height: calc(100% - 50px);
      }

      .info {
        height: 50px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <div class="scene">

    <div class="logo-area">
      <img
        id="logo"
        class="logo"
        src="logo00.jpg"
        alt="第00回 しまなみかぶぬしミーティング"
      >
    </div>

    <div class="info" id="info">
      第00回　2022.9.25　大三島
    </div>

  </div>

  <script>

    const meetings = [
      {
        image: "logo00.jpg",
        info: "第1回　2022年 9月25日 / 00回 in大三島"
      },
      {
        image: "logo01.jpg",
        info: "第２回　2022年12月 4日 / 01回 in大島"
      },
      {
        image: "logo02.jpg",
        info: "第３回　2023年 3月19日 / 02回 in大三島"
      },
      {
        image: "logo03.jpg",
        info: "第４回　2023年11月12日 / 03回 in生口島"
      },
      {
        image: "logo04.jpg",
        info: "第５回　2024年 3月17日 / 04回 in伯方島"
      },
      {
        image: "logo05.jpg",
        info: "第６回　2024年10月 6日 / 05回 in大三島"
      },
      {
        image: "logo06.jpg",
        info: "第７回　2025年 3月16日 / 06回 in因島"
      },
      {
        image: "logo06Again.jpg",
        info: "第８回　2025年 4月27日 / 06回 in因島 Again!"
      },
      {
        image: "logo07.jpg",
        info: "第９回　2025年10月26日 / 07回 in大三島"
      },
      {
        image: "logo08.jpg",
        info: "第10回　2026年 4月26日 / 08回 in大三島"
      }
    ];

    let current = 0;

    const logo = document.getElementById("logo");
    const info = document.getElementById("info");

    document.body.addEventListener("click", () => {

      current++;

      if (current >= meetings.length) {
        current = 0;
      }

      logo.src = meetings[current].image;
      logo.alt = meetings[current].info;
      info.textContent = meetings[current].info;

    });

  </script>

</body>
</html>
