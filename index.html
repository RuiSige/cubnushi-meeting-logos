<!DOCTYPE html>

<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>しまなみかぶぬしミーティングの歩み</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .scene {
      width: min(94vw, 900px);
      height: 92vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .title {
      text-align: center;
      margin-bottom: 20px;
      flex-shrink: 0;
    }

    .title h1 {
      margin: 0 0 8px;
      font-size: clamp(20px, 4vw, 32px);
      font-weight: normal;
      letter-spacing: 0.08em;
    }

    .title h2 {
      margin: 0;
      font-size: clamp(13px, 2.5vw, 18px);
      font-weight: normal;
      letter-spacing: 0.08em;
    }

    .logo-area {
      width: 100%;
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .main-image {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .info {
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      font-size: 13px;
      letter-spacing: 0.04em;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .next-button {
      border: none;
      background: none;
      padding: 0;
      margin: 0;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }

    .next-button img {
      display: block;
      width: auto;
      height: 75px;
      max-width: 150px;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .tap-text {
      margin-top: 3px;
      font-size: 12px;
      letter-spacing: 0.08em;
      color: #555;
    }

    .next-button:focus {
      outline: none;
    }

    .next-event {
      text-align: center;
    }

    .next-event .label {
      font-size: clamp(15px, 3vw, 20px);
      letter-spacing: 0.1em;
      margin-bottom: 12px;
    }

    .next-event .date {
      font-size: clamp(22px, 5vw, 36px);
      letter-spacing: 0.08em;
    }

    @media (max-width: 480px) {
      .scene {
        width: 94vw;
        height: 90vh;
      }

      .title {
        margin-bottom: 12px;
      }

      .info {
        height: 40px;
        font-size: 12px;
      }

      .next-button img {
        height: 65px;
        max-width: 130px;
      }

      .tap-text {
        font-size: 11px;
      }
    }
  </style>

</head>

<body>

  <div class="scene">

```
<div class="title">
  <h1>しまなみかぶぬしミーティングの歩み</h1>
  <h2>5th anniversary &amp; 10th meeting</h2>
</div>

<div class="logo-area" id="imageArea">
  <img
    class="main-image"
    src="5th-02.jpg"
    alt="5th anniversary & 10th meeting"
  >
</div>

<div class="info" id="info"></div>

<button class="next-button" id="nextButton" aria-label="次へ">
  <img src="tap.png" alt="CUB">
  <div class="tap-text">CUBをタップ</div>
</button>
```

  </div>

  <script>

    const meetings = [
      {
        logo: "logo00.jpg",
        flyer: "flyer00.jpg",
        info: "第1回　2022年9月25日 / 00回 in大三島"
      },
      {
        logo: "logo01.jpg",
        flyer: "flyer01.jpg",
        info: "第2回　2022年12月4日 / 01回 in大島"
      },
      {
        logo: "logo02.jpg",
        flyer: "flyer02.jpg",
        info: "第3回　2023年3月19日 / 02回 in大三島"
      },
      {
        logo: "logo03.jpg",
        flyer: "flyer03.jpg",
        info: "第4回　2023年11月12日 / 03回 in生口島"
      },
      {
        logo: "logo04.jpg",
        flyer: "flyer04.jpg",
        info: "第5回　2024年3月17日 / 04回 in伯方島"
      },
      {
        logo: "logo05.jpg",
        flyer: "flyer05.jpg",
        info: "第6回　2024年10月6日 / 05回 in大三島"
      },
      {
        logo: "logo06.jpg",
        flyer: "flyer06.jpg",
        info: "第7回　2025年3月16日 / 06回 in因島"
      },
      {
        logo: "logo06Again.jpg",
        flyer: "flyer06Again.jpg",
        info: "第8回　2025年4月27日 / 06回 in因島 Again!"
      },
      {
        logo: "logo07.jpg",
        flyer: "flyer07.jpg",
        info: "第9回　2025年10月26日 / 07回 in大三島"
      },
      {
        logo: "logo08.jpg",
        flyer: "flyer08.jpg",
        info: "第10回　2026年4月26日 / 08回 in大三島"
      }
    ];

    let current = -1;
    let showingFlyer = false;

    const imageArea = document.getElementById("imageArea");
    const info = document.getElementById("info");
    const nextButton = document.getElementById("nextButton");

    nextButton.addEventListener("click", () => {

      // 表紙から第1回へ
      if (current === -1) {

        current = 0;
        showingFlyer = false;

        showLogo();

        return;
      }

      // ロゴからチラシへ
      if (!showingFlyer) {

        showingFlyer = true;

        showFlyer();

        return;
      }

      // チラシから次の回へ
      current++;
      showingFlyer = false;

      // 第10回のチラシの次
      if (current >= meetings.length) {

        showNextEvent();

        return;
      }

      showLogo();

    });

    function showLogo() {

      imageArea.innerHTML = `
        <img
          class="main-image"
          src="${meetings[current].logo}"
          alt="${meetings[current].info}"
        >
      `;

      info.textContent = meetings[current].info;
    }

    function showFlyer() {

      imageArea.innerHTML = `
        <img
          class="main-image"
          src="${meetings[current].flyer}"
          alt="${meetings[current].info} チラシ"
        >
      `;

      info.textContent = meetings[current].info;
    }

    function showNextEvent() {

      imageArea.innerHTML = `
        <div class="next-event">
          <div class="label">次回開催</div>
          <div class="date">2027年4月予定</div>
        </div>
      `;

      info.textContent = "";

      // 次回開催画面の次は表紙
      current = -1;
      showingFlyer = false;
    }

  </script>

</body>
</html>
