<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>しまなみかぶぬしミーティング｜歴代ロゴ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .scene {
      width: min(94vw, 900px);
      height: 88vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .logo-area {
      width: 100%;
      height: calc(100% - 55px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo {
      display: block;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .info {
      height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      font-size: 13px;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    @media (max-width: 480px) {
      .scene {
        width: 94vw;
        height: 84vh;
      }

      .logo-area {
        height: calc(100% - 50px);
      }

      .info {
        height: 50px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <div class="scene">

    <div class="logo-area">
      <img
        id="logo"
        class="logo"
        src="logo00.jpg"
        alt="第1回 しまなみかぶぬしミーティング"
      >
    </div>

    <div class="info" id="info">
      第1回　2022.9.25　大三島
    </div>

  </div>

  <script>

    const meetings = [
      {
        image: "logo00.jpg",
        info: "第1回　2022.9.25　大三島"
      },
      {
        image: "logo01.jpg",
        info: "第2回　2022.12.4　大島"
      },
      {
        image: "logo02.jpg",
        info: "第3回　2023.3.19　大三島"
      },
      {
        image: "logo03.jpg",
        info: "第4回　2023.11.12　生口島"
      },
      {
        image: "logo04.jpg",
        info: "第5回　2024.3.17　伯方島"
      },
      {
        image: "logo05.jpg",
        info: "第6回　2024.10.6　大三島"
      },
      {
        image: "logo06.jpg",
        info: "第7回　2025.3.16　因島"
      },
      {
        image: "logo07.jpg",
        info: "第8回　2025.4.27　因島 Again!"
      },
      {
        image: "logo08.jpg",
        info: "第9回　2025.10.26　大三島"
      },
      {
        image: "logo09.jpg",
        info: "第10回　2026.4.26　大三島"
      }
    ];

    let current = 0;

    const logo = document.getElementById("logo");
    const info = document.getElementById("info");

    document.body.addEventListener("click", () => {

      current++;

      if (current >= meetings.length) {
        current = 0;
      }

      logo.src = meetings[current].image;
      logo.alt = meetings[current].info;
      info.textContent = meetings[current].info;

    });

  </script>

</body>
</html>
