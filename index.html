<!DOCTYPE html>

<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>しまなみかぶぬしミーティングの歩み</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .scene {
      width: min(94vw, 900px);
      height: 92vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .title {
      text-align: center;
      margin-bottom: 20px;
      flex-shrink: 0;
    }

    .title h1 {
      margin: 0 0 8px;
      font-size: clamp(20px, 4vw, 32px);
      font-weight: normal;
      letter-spacing: 0.08em;
    }

    .title h2 {
      margin: 0;
      font-size: clamp(13px, 2.5vw, 18px);
      font-weight: normal;
      letter-spacing: 0.08em;
    }

    .logo-area {
      width: 100%;
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo {
      display: block;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .info {
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      font-size: 13px;
      letter-spacing: 0.04em;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .next-button {
      border: none;
      background: none;
      padding: 4px;
      margin: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }

    .next-button img {
      display: block;
      width: auto;
      height: 55px;
      max-width: 120px;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .next-button:focus {
      outline: none;
    }

    .next-event {
      text-align: center;
    }

    .next-event .label {
      font-size: clamp(15px, 3vw, 20px);
      letter-spacing: 0.1em;
      margin-bottom: 12px;
    }

    .next-event .date {
      font-size: clamp(22px, 5vw, 36px);
      letter-spacing: 0.08em;
    }

    @media (max-width: 480px) {
      .scene {
        width: 94vw;
        height: 90vh;
      }

      .title {
        margin-bottom: 12px;
      }

      .info {
        height: 40px;
        font-size: 12px;
      }

      .next-button img {
        height: 48px;
        max-width: 100px;
      }
    }
  </style>

</head>

<body>

  <div class="scene">

```
<div class="title">
  <h1>しまなみかぶぬしミーティングの歩み</h1>
  <h2>5th anniversary &amp; 10th meeting</h2>
</div>

<div class="logo-area" id="logoArea">
  <img
    id="logo"
    class="logo"
    src="5th-02.jpg"
    alt="5th anniversary & 10th meeting"
  >
</div>

<div class="info" id="info"></div>

<button class="next-button" id="nextButton" aria-label="次へ">
  <img src="tap.png" alt="TAP">
</button>
```

  </div>

  <script>

    const meetings = [
      {
        image: "logo00.jpg",
        info: "第1回　2022年9月25日 / 00回 in大三島"
      },
      {
        image: "logo01.jpg",
        info: "第2回　2022年12月4日 / 01回 in大島"
      },
      {
        image: "logo02.jpg",
        info: "第3回　2023年3月19日 / 02回 in大三島"
      },
      {
        image: "logo03.jpg",
        info: "第4回　2023年11月12日 / 03回 in生口島"
      },
      {
        image: "logo04.jpg",
        info: "第5回　2024年3月17日 / 04回 in伯方島"
      },
      {
        image: "logo05.jpg",
        info: "第6回　2024年10月6日 / 05回 in大三島"
      },
      {
        image: "logo06.jpg",
        info: "第7回　2025年3月16日 / 06回 in因島"
      },
      {
        image: "logo07.jpg",
        info: "第8回　2025年4月27日 / 06回 in因島 Again!"
      },
      {
        image: "logo08.jpg",
        info: "第9回　2025年10月26日 / 07回 in大三島"
      },
      {
        image: "logo09.jpg",
        info: "第10回　2026年4月26日 / 08回 in大三島"
      }
    ];

    let current = -1;

    const logoArea = document.getElementById("logoArea");
    const info = document.getElementById("info");
    const nextButton = document.getElementById("nextButton");

    nextButton.addEventListener("click", () => {

      current++;

      if (current < meetings.length) {

        logoArea.innerHTML = `
          <img
            class="logo"
            src="${meetings[current].image}"
            alt="${meetings[current].info}"
          >
        `;

        info.textContent = meetings[current].info;

      } else {

        logoArea.innerHTML = `
          <div class="next-event">
            <div class="label">次回開催</div>
            <div class="date">2027年4月予定</div>
          </div>
        `;

        info.textContent = "";

        current = -1;
      }

    });

  </script>

</body>
</html>
